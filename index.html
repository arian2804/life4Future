<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniTrack v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#09090B', // Zinc 950
              surface: '#18181B', // Zinc 900
              border: '#27272A', // Zinc 800
              primary: '#3B82F6', // Blue 500
              health: '#10B981', // Emerald 500
              research: '#8B5CF6', // Violet 500
              alert: '#EF4444', // Red 500
              text: '#F4F4F5', // Zinc 100
              muted: '#A1A1AA', // Zinc 400
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              serif: ['Merriweather', 'serif'],
            }
          }
        }
      }
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #09090B;
        color: #F4F4F5;
        font-family: 'Inter', sans-serif;
      }
      /* Custom Scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #09090B; 
      }
      ::-webkit-scrollbar-thumb {
        background: #27272A; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3F3F46; 
      }
    </style>

  }
}
